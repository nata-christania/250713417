<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Turnamen E-Sport</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="wrapper">
        <h1>Formulir Pendaftaran Turnamen E-Sport</h1>
        
        <form action="" method="post" enctype="multipart/form-data">

            <h2>Data Peserta</h2>
            <table>
                <tr>
                    <td class="label"><label for="nama">Nama Lengkap</label></td>
                    <td><input type="text" id="nama" name="nama" size="30" /></td>
                </tr>
                <tr>
                    <td class="label"><label for="prodi">Program Studi</label></td>
                    <td><input type="text" id="prodi" name="prodi" size="30" /></td>
                </tr>
                <tr>
                    <td class="label"><label>Gender</label></td>
                    <td>
                        <input type="radio" id="male" name="gen" value="Male" />
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gen" value="Female" />
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="game">Divisi Game</label></td>
                    <td>
                        <select id="game" name="game">
                            <option>Valorant</option>
                            <option>Honor of Kings</option>
                            <option>PUBG Mobile</option>
                        </select>
                    </td>
                </tr>
            </table>

            <h2>Pilihan Kategori</h2>
            <table>
                <tr>
                    <td class="label"><label>Kategori Pemain</label></td>
                    <td>
                        <input type="radio" id="solo" name="pemain" value="SOLO" />
                        <label for="solo">SOLO</label>
                        <input type="radio" id="tim" name="pemain" value="TEAM" />
                        <label for="team">TEAM</label>
                    </td>
                </tr>
                <tr>
                    <td class="label" style="vertical-align: top;"><label>Jenis Turnamen</label></td>
                    <td>
                        <div class="checkbox-group">
                            <input type="checkbox" id="topik1" name="topik" value="Turnamen Internal" />
                            <label for="topik1">Turnamen Internal</label><br />
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="topik2" name="topik" value="Turnamen Regional" />
                            <label for="topik2">Turnamen Regional</label><br />
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="topik3" name="topik" value="National Qualifier" />
                            <label for="topik3">National Qualifier</label>
                        </div>
                    </td>
                </tr>
            </table>

            <h2>Informasi Tambahan</h2>
            <table>
                <tr>
                    <td class="label" style="vertical-align: top;"><label for="motiv">Motivasi Mengikuti Turnamen</label></td>
                    <td><textarea id="motiv" name="motiv" rows="7" cols="40"></textarea></td>
                </tr>
                <tr>
                    <td class="label"><label for="bukti">Bukti Pembayaran</label></td>
                    <td><input type="file" id="bukti" name="bukti" size="18" accept="image/gif, image/jpeg, image/png" /></td>
                </tr>
                <tr>
                    <td colspan="2" class="submit-row">
                        <input type="submit" name="simpan" value="SUBMIT" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
